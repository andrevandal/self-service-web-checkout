services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: file:/app/data/local.db
      KIOSK_CLAIM_PASSWORD: "${KIOSK_CLAIM_PASSWORD:?KIOSK_CLAIM_PASSWORD must be set}"
      KIOSK_COOKIE_SECRET: "${KIOSK_COOKIE_SECRET:?KIOSK_COOKIE_SECRET must be set}"
      STAFF_COOKIE_SECRET: "${STAFF_COOKIE_SECRET:?STAFF_COOKIE_SECRET must be set}"
      KIOSK_COOKIE_SECURE: "${KIOSK_COOKIE_SECURE:-false}"
      STAFF_COOKIE_SECURE: "${STAFF_COOKIE_SECURE:-false}"
    volumes:
      - local-data:/app/data

volumes:
  local-data:
