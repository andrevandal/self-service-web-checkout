services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      DATABASE_URL: http://db:8080
      KIOSK_CLAIM_PASSWORD: "${KIOSK_CLAIM_PASSWORD:?KIOSK_CLAIM_PASSWORD must be set}"
      KIOSK_COOKIE_SECRET: "${KIOSK_COOKIE_SECRET:?KIOSK_COOKIE_SECRET must be set}"
      STAFF_COOKIE_SECRET: "${STAFF_COOKIE_SECRET:?STAFF_COOKIE_SECRET must be set}"
      KIOSK_COOKIE_SECURE: "${KIOSK_COOKIE_SECURE:-false}"
      STAFF_COOKIE_SECURE: "${STAFF_COOKIE_SECURE:-false}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend

  db:
    image: ghcr.io/tursodatabase/libsql-server:latest
    volumes:
      - sqld-data:/var/lib/sqld
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - backend

networks:
  backend:
    internal: true
  frontend:

volumes:
  sqld-data:
