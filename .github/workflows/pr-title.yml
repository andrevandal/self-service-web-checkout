name: PR title

on:
  pull_request:

jobs:
  lint-pr-title:
    permissions:
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          requireScope: false
          subjectPattern: ^[a-z].+$
          subjectPatternError: The subject must start with a lowercase letter.
